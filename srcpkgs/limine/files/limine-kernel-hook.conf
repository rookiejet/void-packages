# Options for kernel hook scripts installed by the limine package.
#
# This file is sourced by /bin/sh. Values containing spaces or shell
# special characters should be quoted.

# Set this option to 1 to enable the hook.
UPDATE_LIMINE=0

# Absolute path to the directory used by the hook for Limine helper
# files.  When LIMINE_BIOS=1, limine-bios.sys is copied here.  This
# only copies the helper file; it does not install Limine to a BIOS
# disk.  Use `limine bios-install` separately to write Limine's BIOS
# boot code to the target disk or image.
LIMINE_HELPER_DIR=/boot/efi/EFI/BOOT

# Absolute path to the Limine configuration file managed by the hook.
# This path is interpreted relative to ROOTDIR.
LIMINE_CONF=/boot/efi/EFI/BOOT/limine.conf

# Absolute path to the Limine UEFI executable managed by the hook.
# This path is interpreted relative to ROOTDIR.
LIMINE_EFI=/boot/efi/EFI/BOOT/BOOTX64.EFI

# Prefix used for generated kernel and initramfs paths in limine.conf.
LIMINE_BOOT_PREFIX="boot():"

# Label prefix used for generated kernel menu entries.
LIMINE_LABEL="Void Linux"

# Title of the nested Limine menu directory containing generated
# kernel entries.
LIMINE_MENU_TITLE="Void Linux"

# Set this option to 1 to also copy the Limine BIOS helper file
# limine-bios.sys into LIMINE_HELPER_DIR.
LIMINE_BIOS=0

# Kernel command line used for generated menu entries.
CMDLINE=""

# Set this option to 1 to enable Secure Boot handling in the hook.
# Requires the sbsigntool package to be installed.
LIMINE_SECUREBOOT=0

# The key and certificate used by sbsign.
# limine will only sign if EFI_KEY_FILE:
#  - owner: root
#  - permission: 0*00
EFI_KEY_FILE=/etc/efikeys/db.key
EFI_CERT_FILE=/etc/efikeys/db.crt

# Set this option to 1 to keep an unsigned backup of the EFI
# executable as ${LIMINE_EFI}.unsigned after signing.
EFI_KEEP_UNSIGNED=0

# OpenSSL/LibreSSL engine to load the signing key.
# Do not uncomment this option unless you know what you're doing.
# EFI_SIGN_ENGINE=
